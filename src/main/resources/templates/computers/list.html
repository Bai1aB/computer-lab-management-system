<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Computers', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h2 class="h5 mb-0">Computer Inventory</h2>
            <a class="btn btn-primary" th:href="@{/computers/new}">Add Computer</a>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>CPU</th>
                    <th>RAM</th>
                    <th>Storage</th>
                    <th>Room</th>
                    <th>Operating System</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="computer : ${computers}">
                    <td class="fw-semibold" th:text="${computer.name}">PC-01</td>
                    <td th:text="${computer.cpu}">Intel Core i5</td>
                    <td th:text="${computer.ram}">16 GB</td>
                    <td th:text="${computer.storage}">512 GB SSD</td>
                    <td th:text="${computer.labRoom != null ? computer.labRoom.roomNumber : 'Unassigned'}">101</td>
                    <td th:text="${computer.operatingSystem != null ? computer.operatingSystem.name + ' ' + computer.operatingSystem.version : 'Not set'}">Ubuntu 24.04</td>
                    <td><span class="badge text-bg-secondary badge-status" th:text="${computer.status}">AVAILABLE</span></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/computers/{id}/edit(id=${computer.id})}">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(computers)}">
                    <td colspan="8" class="text-center text-secondary py-4">No computers found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
