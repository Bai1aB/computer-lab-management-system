<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Create Booking', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel p-4">
        <form th:action="@{/bookings}" th:object="${bookingForm}" method="post" class="row g-3" novalidate>
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="col-12">
                <h2 class="h5 mb-0">Create Booking</h2>
                <div class="text-secondary">Booking will be assigned to your signed-in account.</div>
            </div>

            <div class="col-12">
                <label for="computerId" class="form-label">Computer</label>
                <select id="computerId" class="form-select" th:field="*{computerId}"
                        th:classappend="${#fields.hasErrors('computerId')} ? ' is-invalid'">
                    <option value="">Select computer</option>
                    <option th:each="computer : ${computers}" th:value="${computer.id}"
                            th:text="${computer.name + ' - ' + (computer.labRoom != null ? computer.labRoom.roomNumber : 'Unassigned') + ' - ' + computer.status}">
                        PC-01
                    </option>
                </select>
                <div class="invalid-feedback" th:errors="*{computerId}">Computer error</div>
            </div>

            <div class="col-12 col-md-6">
                <label for="startTime" class="form-label">Start Time</label>
                <input id="startTime" type="datetime-local" class="form-control" th:field="*{startTime}"
                       th:classappend="${#fields.hasErrors('startTime')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{startTime}">Start time error</div>
            </div>

            <div class="col-12 col-md-6">
                <label for="endTime" class="form-label">End Time</label>
                <input id="endTime" type="datetime-local" class="form-control" th:field="*{endTime}"
                       th:classappend="${#fields.hasErrors('endTime')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{endTime}">End time error</div>
            </div>

            <div class="col-12">
                <label for="purpose" class="form-label">Purpose</label>
                <textarea id="purpose" rows="4" class="form-control" th:field="*{purpose}"
                          th:classappend="${#fields.hasErrors('purpose')} ? ' is-invalid'"></textarea>
                <div class="invalid-feedback" th:errors="*{purpose}">Purpose error</div>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Booking</button>
                <a class="btn btn-outline-secondary" th:href="@{/bookings}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
