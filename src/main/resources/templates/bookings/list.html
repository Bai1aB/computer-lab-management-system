<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Bookings', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h2 class="h5 mb-0">Bookings</h2>
            <a class="btn btn-primary" th:href="@{/bookings/new}">Create Booking</a>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>User</th><th>Computer</th><th>Start</th><th>End</th><th>Purpose</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td class="fw-semibold" th:text="${booking.user != null ? booking.user.fullName : 'User not set'}">Jane Doe</td>
                    <td th:text="${booking.computer != null ? booking.computer.name : 'Computer not set'}">PC-01</td>
                    <td th:text="${booking.startTime}">2026-05-17T10:00</td>
                    <td th:text="${booking.endTime}">2026-05-17T12:00</td>
                    <td th:text="${booking.purpose}">Class</td>
                    <td><span class="badge text-bg-secondary" th:text="${booking.status}">ACTIVE</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="6" class="text-center text-secondary py-4">No bookings found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
