<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Computer Lab Management'">Computer Lab Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell d-flex">
    <aside class="app-sidebar p-3">
        <a class="app-brand d-block mb-4 text-decoration-none" th:href="@{/dashboard}">Computer Lab</a>
        <nav class="d-grid gap-1">
            <a class="app-nav-link" th:classappend="${activePage == 'dashboard'} ? ' active'" th:href="@{/dashboard}">Dashboard</a>
            <a class="app-nav-link" th:classappend="${activePage == 'computers'} ? ' active'" th:href="@{/computers}">Computers</a>
            <a class="app-nav-link" th:classappend="${activePage == 'labrooms'} ? ' active'" th:href="@{/labrooms}">Lab Rooms</a>
            <a class="app-nav-link" th:classappend="${activePage == 'operating-systems'} ? ' active'" th:href="@{/operating-systems}">Operating Systems</a>
            <a class="app-nav-link" th:classappend="${activePage == 'bookings'} ? ' active'" th:href="@{/bookings}">Bookings</a>
            <a class="app-nav-link" th:classappend="${activePage == 'maintenance-tickets'} ? ' active'" th:href="@{/maintenance-tickets}">Maintenance Tickets</a>
        </nav>
    </aside>

    <main class="app-main flex-grow-1">
        <header class="page-header px-4 py-3">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div>
                    <h1 class="h3 mb-0" th:text="${title}">Dashboard</h1>
                    <div class="text-secondary">Computer Lab Management System</div>
                </div>
                <a class="btn btn-primary" th:href="@{/computers/new}">Add Computer</a>
            </div>
        </header>

        <section class="p-4">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:replace="${content}"></div>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
