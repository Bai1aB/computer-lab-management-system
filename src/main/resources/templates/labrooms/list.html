<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Lab Rooms', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom"><h2 class="h5 mb-0">Lab Rooms</h2></div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Room</th><th>Building</th><th>Capacity</th></tr>
                </thead>
                <tbody>
                <tr th:each="room : ${labRooms}">
                    <td class="fw-semibold" th:text="${room.roomNumber}">101</td>
                    <td th:text="${room.building}">Main</td>
                    <td th:text="${room.capacity}">30</td>
                </tr>
                <tr th:if="${#lists.isEmpty(labRooms)}">
                    <td colspan="3" class="text-center text-secondary py-4">No lab rooms found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
