<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Operating Systems', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom"><h2 class="h5 mb-0">Operating Systems</h2></div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Name</th><th>Version</th><th>Architecture</th></tr>
                </thead>
                <tbody>
                <tr th:each="os : ${operatingSystems}">
                    <td class="fw-semibold" th:text="${os.name}">Ubuntu</td>
                    <td th:text="${os.version}">24.04</td>
                    <td th:text="${os.architecture}">x64</td>
                </tr>
                <tr th:if="${#lists.isEmpty(operatingSystems)}">
                    <td colspan="3" class="text-center text-secondary py-4">No operating systems found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
