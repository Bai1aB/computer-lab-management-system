<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Operating Systems', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h2 class="h5 mb-0">Operating Systems</h2>
            <a th:if="${currentUser != null and currentUser.role != null and currentUser.role.name() == 'ADMIN'}"
               class="btn btn-primary" th:href="@{/operating-systems/new}">Add Operating System</a>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Name</th><th>Version</th><th>Architecture</th><th class="text-end" th:if="${currentUser != null and currentUser.role != null and currentUser.role.name() == 'ADMIN'}">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="os : ${operatingSystems}">
                    <td class="fw-semibold" th:text="${os.name}">Ubuntu</td>
                    <td th:text="${os.version}">24.04</td>
                    <td th:text="${os.architecture}">x64</td>
                    <td class="text-end" th:if="${currentUser != null and currentUser.role != null and currentUser.role.name() == 'ADMIN'}">
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/operating-systems/{id}/edit(id=${os.id})}">Edit</a>
                            <form th:action="@{/operating-systems/{id}/delete(id=${os.id})}" method="post">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(operatingSystems)}">
                    <td colspan="4" class="text-center text-secondary py-4">No operating systems found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
