<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${pageTitle}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel p-4">
        <form th:action="${operatingSystemForm.id == null} ? @{/operating-systems} : @{/operating-systems/{id}(id=${operatingSystemForm.id})}"
              th:object="${operatingSystemForm}" method="post" class="row g-3" novalidate>
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="col-12">
                <h2 class="h5 mb-0" th:text="${pageTitle}">Add Operating System</h2>
            </div>

            <div class="col-12 col-md-4">
                <label for="name" class="form-label">Name</label>
                <input id="name" type="text" class="form-control" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{name}">Name error</div>
            </div>

            <div class="col-12 col-md-4">
                <label for="version" class="form-label">Version</label>
                <input id="version" type="text" class="form-control" th:field="*{version}"
                       th:classappend="${#fields.hasErrors('version')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{version}">Version error</div>
            </div>

            <div class="col-12 col-md-4">
                <label for="architecture" class="form-label">Architecture</label>
                <input id="architecture" type="text" class="form-control" th:field="*{architecture}"
                       th:classappend="${#fields.hasErrors('architecture')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{architecture}">Architecture error</div>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/operating-systems}">Cancel</a>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
