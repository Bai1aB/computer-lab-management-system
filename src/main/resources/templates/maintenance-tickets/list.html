<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Maintenance Tickets', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom"><h2 class="h5 mb-0">Maintenance Tickets</h2></div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Computer</th><th>Description</th><th>Priority</th><th>Status</th><th>Created</th></tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td class="fw-semibold" th:text="${ticket.computer != null ? ticket.computer.name : 'Computer not set'}">PC-01</td>
                    <td th:text="${ticket.description}">Issue description</td>
                    <td><span class="badge text-bg-info" th:text="${ticket.priority}">MEDIUM</span></td>
                    <td><span class="badge text-bg-warning" th:text="${ticket.status}">OPEN</span></td>
                    <td th:text="${ticket.createdAt}">2026-05-17T10:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(tickets)}">
                    <td colspan="5" class="text-center text-secondary py-4">No maintenance tickets found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
