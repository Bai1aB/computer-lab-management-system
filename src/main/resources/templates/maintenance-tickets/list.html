<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Maintenance Tickets', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="content-panel">
        <div class="p-3 border-bottom d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h2 class="h5 mb-0">Maintenance Tickets</h2>
            <a class="btn btn-primary" th:href="@{/maintenance-tickets/new}">Create Ticket</a>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Computer</th><th>Description</th><th>Priority</th><th>Status</th><th>Created</th><th class="text-end" th:if="${currentUser != null and currentUser.role != null and currentUser.role.name() == 'ADMIN'}">Admin Action</th></tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td class="fw-semibold" th:text="${ticket.computer != null ? ticket.computer.name : 'Computer not set'}">PC-01</td>
                    <td th:text="${ticket.description}">Issue description</td>
                    <td><span class="badge text-bg-info" th:text="${ticket.priority}">MEDIUM</span></td>
                    <td><span class="badge text-bg-warning" th:text="${ticket.status}">OPEN</span></td>
                    <td th:text="${ticket.createdAt}">2026-05-17T10:00</td>
                    <td class="text-end" th:if="${currentUser != null and currentUser.role != null and currentUser.role.name() == 'ADMIN'}">
                        <form class="d-flex justify-content-end gap-2" th:action="@{/maintenance-tickets/{id}/status(id=${ticket.id})}" method="post">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <select class="form-select form-select-sm w-auto" name="status" aria-label="Ticket status">
                                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"
                                        th:selected="${status == ticket.status}">OPEN</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Update</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tickets)}">
                    <td colspan="6" class="text-center text-secondary py-4">No maintenance tickets found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
