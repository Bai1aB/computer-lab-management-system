<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Computer Lab Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="container d-flex justify-content-center">
    <div class="auth-card p-4">
        <div class="mb-4">
            <h1 class="h3 mb-1">Create account</h1>
            <div class="text-secondary">Register for Computer Lab Management</div>
        </div>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="row g-3" novalidate>
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="col-12">
                <label for="fullName" class="form-label">Full Name</label>
                <input id="fullName" type="text" class="form-control" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{fullName}">Name error</div>
            </div>

            <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}">Email error</div>
            </div>

            <div class="col-12">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'">
                <div class="invalid-feedback" th:errors="*{password}">Password error</div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </div>
        </form>

        <div class="mt-4 text-center">
            <span class="text-secondary">Already registered?</span>
            <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</main>
</body>
</html>
